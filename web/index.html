<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Navi Multi-AI Chat</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0d10;--panel:#14181e;--panel2:#0f1318;--line:#2a313b;--text:#f4f7fb;--muted:#9aa6b4;--ok:#76d99c;--bad:#ffb4b4;--warn:#ffd27a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}.app{height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column}
.topbar{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:grid;grid-template-columns:minmax(120px,170px) 1fr 44px;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
#providerTop{width:100%;border:1px solid #384250;border-radius:12px;background:var(--panel);color:var(--text);padding:9px 30px 9px 10px;font-size:13px}.brand{text-align:center}.brand b{display:block}.brand small{color:var(--muted)}.gear{width:42px;height:42px;border:1px solid #384250;border-radius:12px;background:var(--panel);color:var(--text);font-size:20px}
.screen{display:none;min-height:0;flex:1}.screen.active{display:flex}.page{flex-direction:column;overflow:auto;padding:14px 14px 40px}.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.home{border:1px solid #384250;border-radius:12px;background:var(--panel);color:var(--text);padding:10px 13px;font-weight:700}.title{font-size:21px;font-weight:800}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin:-7px 0 14px}
#chatScreen{flex-direction:column}.messages{flex:1;overflow:auto;padding:16px 14px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:6px}.msg{max-width:86%;margin:0 0 14px}.msg.user{margin-left:auto}.bubble{border:1px solid var(--line);border-radius:16px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.6}.user .bubble{background:#202833}.assistant .bubble{background:var(--panel)}.meta{color:var(--muted);font-size:11px;margin:5px 4px}.error{color:var(--bad)}
.composer-wrap{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.composer{border:1px solid #394453;background:var(--panel2);border-radius:18px;padding:8px}.composer textarea{width:100%;min-height:74px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:8px}.composer-row{display:flex;gap:8px;align-items:center}.mode{flex:1;color:var(--muted);font-size:12px;padding-left:8px}.send{min-width:92px;border:0;border-radius:12px;padding:10px 14px;font-weight:800}
.list{display:grid;gap:10px}.rowbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);padding:15px}.rowbtn strong{display:block}.rowbtn small{display:block;color:var(--muted);margin-top:4px}.state{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}.state.ok{color:var(--ok)}.state.warn{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.keyinput{width:100%;border:1px solid #394453;border-radius:11px;background:var(--panel2);color:var(--text);padding:12px}.save,.secondary{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;font-weight:800}.secondary{background:transparent;color:var(--text);border:1px solid #394453}.save-status{min-height:22px;margin-top:10px;font-size:12px;color:var(--muted)}.save-status.ok{color:var(--ok)}.save-status.bad{color:var(--bad)}.note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <select id="providerTop" aria-label="AI切り替え"><option value="">自動</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="copilot">Copilot</option></select>
  <div class="brand"><b>ナビィ</b><small>Multi-AI Chat</small></div>
  <button id="settingsBtn" class="gear" aria-label="設定">⚙︎</button>
</header>

<section id="chatScreen" class="screen active">
 <div id="messages" class="messages"><div id="emptyState" class="empty"><div><strong>何をする？</strong>普段の言葉でそのまま相談してください。</div></div></div>
 <div class="composer-wrap"><div class="composer"><textarea id="message" placeholder="ナビィに相談する…" enterkeyhint="send"></textarea><div class="composer-row"><div id="mode" class="mode">AI: 自動</div><button id="send" class="send">送信</button></div></div></div>
</section>

<section id="settingsScreen" class="screen page">
 <div class="page-head"><button class="home" data-home>⌂ ホーム</button><div class="title">設定</div></div>
 <div class="list">
   <button id="openVault" class="rowbtn"><span><strong>API保管庫</strong><small>Gemini / OpenAI / Copilot</small></span><span>›</span></button>
   <button id="openGateway" class="rowbtn"><span><strong>接続キー</strong><small>GATEWAY_CHAT_KEY</small></span><span id="gatewayState" class="state">未保存</span></button>
 </div>
 <div class="card"><label class="check"><input id="verify" type="checkbox">2つ目のAIでも確認する</label></div>
</section>

<section id="vaultScreen" class="screen page">
 <div class="page-head"><button class="home" data-home>⌂ ホーム</button><div class="title">API保管庫</div></div>
 <div class="sub">APIだけをここにまとめます。3つは完全に別保存です。</div>
 <div class="list">
   <button class="rowbtn" data-api="gemini"><span><strong>Gemini</strong><small>API</small></span><span id="geminiVaultState" class="state">未保存</span></button>
   <button class="rowbtn" data-api="openai"><span><strong>OpenAI</strong><small>API</small></span><span id="openaiVaultState" class="state">未保存</span></button>
   <button class="rowbtn" data-api="copilot"><span><strong>Copilot</strong><small>API</small></span><span id="copilotVaultState" class="state">未保存</span></button>
 </div>
 <div class="note">端末保存とは別に、Railway側に同じプロバイダの内部設定がある場合は、端末側が消えてもナビィは内部設定を自動で使います。APIキーそのものは画面へ戻しません。</div>
</section>

<section id="keyScreen" class="screen page">
 <div class="page-head"><button class="home" data-home>⌂ ホーム</button><div id="keyTitle" class="title">キー保存</div></div>
 <div id="keyHelp" class="sub"></div>
 <div class="card">
   <input id="keyInput" class="keyinput" type="password" autocomplete="off">
   <button id="saveKey" class="save">保存</button>
   <button id="restoreKey" class="secondary" hidden>端末内部バックアップから復元</button>
   <div id="saveStatus" class="save-status"></div>
 </div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const S={
 gateway:"navi.v5.gateway",provider:"navi.v5.provider",verify:"navi.v5.verify",
 gemini:"navi.v5.gemini.current",geminiBackup:"navi.v5.gemini.backup",geminiOK:"navi.v5.gemini.ok",
 openai:"navi.v5.openai.current",openaiBackup:"navi.v5.openai.backup",openaiOK:"navi.v5.openai.ok",
 copilot:"navi.v5.copilot.current",copilotBackup:"navi.v5.copilot.backup",copilotOK:"navi.v5.copilot.ok"
};

let editing=null, serverProviders={openai:false,gemini:false,copilot:false};

function firstStored(keys){
  for(const key of keys){
    const v=localStorage.getItem(key);
    if(v) return v;
  }
  return "";
}
function migrateLegacyStorage(){
  if(!localStorage.getItem(S.gateway)){
    const legacyGateway = firstStored(["navi.v4.gateway","navi.settings.gateway_key"]) || sessionStorage.getItem("navi_access_key") || "";
    if(legacyGateway) localStorage.setItem(S.gateway, legacyGateway);
  }

  if(!localStorage.getItem(S.gemini)){
    const v=firstStored(["navi.v4.gemini","navi.settings.gemini_api_key"]);
    if(v){
      localStorage.setItem(S.gemini,v);
      localStorage.setItem(S.geminiBackup,v);
      const verified = localStorage.getItem("navi.v4.gemini.ok")==="1";
      if(verified) localStorage.setItem(S.geminiOK,"1");
    }
  }

  if(!localStorage.getItem(S.openai)){
    const v=firstStored(["navi.v4.openai","navi.settings.openai_api_key"]);
    if(v){
      localStorage.setItem(S.openai,v);
      localStorage.setItem(S.openaiBackup,v);
      const verified = localStorage.getItem("navi.v4.openai.ok")==="1";
      if(verified) localStorage.setItem(S.openaiOK,"1");
    }
  }

  if(!localStorage.getItem(S.provider)){
    const p=firstStored(["navi.v4.provider","navi.settings.provider"]);
    if(p) localStorage.setItem(S.provider,p);
  }

  if(localStorage.getItem(S.verify)===null){
    const legacyV4=localStorage.getItem("navi.v4.verify");
    const legacySettings=localStorage.getItem("navi.settings.verify");
    const legacy = legacyV4 !== null ? legacyV4 : legacySettings;
    if(legacy !== null) localStorage.setItem(S.verify, legacy==="true" ? "1" : legacy);
  }
}

const meta={
 gateway:{title:"接続キー",help:"ナビィの入口キーだけを保存します。",verify:"gateway"},
 gemini:{title:"Gemini API",help:"Gemini専用。確認に成功した値だけ保存し、端末内部にも予備コピーを残します。",verify:"provider"},
 openai:{title:"OpenAI API",help:"OpenAI専用。確認に成功した値だけ保存し、端末内部にも予備コピーを残します。",verify:"provider"},
 copilot:{title:"Copilot API",help:"Copilot専用。現在は将来のBridge接続用キーとして別保存します。",verify:"copilot"}
};
function show(id){["chatScreen","settingsScreen","vaultScreen","keyScreen"].forEach(x=>$(x).classList.remove("active"));$(id).classList.add("active")}
function home(){show("chatScreen");$("message").focus()}
function cur(k){return localStorage.getItem(S[k])||""}
function backup(k){return localStorage.getItem(S[k+"Backup"])||""}
function ok(k){return k==="gateway"?!!cur("gateway"):localStorage.getItem(S[k+"OK"])==="1"}
function useKey(k){if(ok(k)&&cur(k))return cur(k);if(ok(k)&&backup(k))return backup(k);return ""}
function stateText(k){
 const local=ok(k)&&(cur(k)||backup(k)); const internal=!!serverProviders[k];
 return (local?"端末保存済み":"端末未保存")+"\n"+(internal?"内部設定あり":"内部設定なし");
}
function refresh(){
 $("gatewayState").textContent=cur("gateway")?"保存済み":"未保存";
 ["gemini","openai","copilot"].forEach(k=>{const el=$(k+"VaultState");el.textContent=stateText(k);el.className="state"+((ok(k)||serverProviders[k])?" ok":"")});
 const p=localStorage.getItem(S.provider)||"";$("providerTop").value=p;
 $("verify").checked=localStorage.getItem(S.verify)==="1";
 const names={"":"自動",gemini:"Gemini",openai:"OpenAI",copilot:"Copilot"};
 $("mode").textContent="AI: "+names[p]+($("verify").checked?" / 2AI確認":"");
}
async function loadServerStatus(){
 try{const r=await fetch("/api/status");const d=await r.json();serverProviders=d.providers||serverProviders;}catch{}
 refresh();
}
function openEditor(k){
 editing=k;$("keyTitle").textContent=meta[k].title;$("keyHelp").textContent=meta[k].help;
 $("keyInput").value=cur(k);$("saveStatus").textContent="";$("saveStatus").className="save-status";
 $("restoreKey").hidden=!(k!=="gateway"&&backup(k));show("keyScreen");
}
async function validateGateway(v){const r=await fetch("/api/chat/providers",{headers:{"Authorization":"Bearer "+v}});if(!r.ok)throw new Error("接続キーが一致しません")}
async function validateProvider(k,v){
 const g=cur("gateway");if(!g)throw new Error("先に接続キーを保存してください");
 const r=await fetch("/api/provider-key/validate",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+g},body:JSON.stringify({provider:k,api_key:v})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"APIキーを確認できません")
}
$("saveKey").onclick=async()=>{
 const v=$("keyInput").value.trim(),st=$("saveStatus");if(!v){st.textContent="入力してください";st.className="save-status bad";return}
 $("saveKey").disabled=true;st.textContent="確認中…";st.className="save-status";
 try{
   if(editing==="gateway") await validateGateway(v);
   else if(editing==="gemini"||editing==="openai") await validateProvider(editing,v);
   localStorage.setItem(S[editing],v);
   if(editing!=="gateway"){localStorage.setItem(S[editing+"Backup"],v);localStorage.setItem(S[editing+"OK"],"1")}
   st.textContent=editing==="copilot"?"保存しました。Copilot接続先ができたら接続確認します。":"確認して保存しました。予備コピーも端末内部に保存済みです。";
   st.className="save-status ok";refresh();
 }catch(e){st.textContent="保存していません："+e.message;st.className="save-status bad"}
 finally{$("saveKey").disabled=false}
};
$("restoreKey").onclick=()=>{const b=backup(editing);if(b){localStorage.setItem(S[editing],b);$("keyInput").value=b;$("saveStatus").textContent="端末内部バックアップから復元しました。";$("saveStatus").className="save-status ok";refresh()}};
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=home);
$("settingsBtn").onclick=()=>{refresh();show("settingsScreen")};
$("openVault").onclick=()=>{refresh();show("vaultScreen")};
$("openGateway").onclick=()=>openEditor("gateway");
document.querySelectorAll("[data-api]").forEach(b=>b.onclick=()=>openEditor(b.dataset.api));
$("providerTop").onchange=()=>{localStorage.setItem(S.provider,$("providerTop").value);refresh()};
$("verify").onchange=()=>{localStorage.setItem(S.verify,$("verify").checked?"1":"0");refresh()};
function add(role,text,meta="",err=false){const e=$("emptyState");if(e)e.remove();const w=document.createElement("div");w.className="msg "+role;const b=document.createElement("div");b.className="bubble"+(err?" error":"");b.textContent=text;w.appendChild(b);if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m)}$("messages").appendChild(w);$("messages").scrollTop=$("messages").scrollHeight;return w}
async function sendMessage(){
 const text=$("message").value.trim();if(!text)return;const gateway=cur("gateway");if(!gateway){add("assistant","接続キーが見つかりません。右上の設定から接続キーを確認してください。","",true);return}
 const preferred=localStorage.getItem(S.provider)||"",verify=localStorage.getItem(S.verify)==="1";
 add("user",text);$("message").value="";$("send").disabled=true;const load=add("assistant","ナビィが処理中…");
 try{
   const h={"Content-Type":"application/json","Authorization":"Bearer "+gateway};
   const g=useKey("gemini"),o=useKey("openai"),c=useKey("copilot");
   if(g)h["X-Gemini-API-Key"]=g;if(o)h["X-OpenAI-API-Key"]=o;if(c)h["X-Copilot-API-Key"]=c;
   const r=await fetch("/api/chat",{method:"POST",headers:h,body:JSON.stringify({message:text,preferred_provider:preferred||null,verify})});
   const d=await r.json();if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));load.remove();
   const who=d?.navi?.selected_provider||"AI",ver=d?.navi?.verifier?" / 検証: "+d.navi.verifier:"";add("assistant",d.integrated_answer||d?.answer?.text||"","担当: "+who+ver);
 }catch(e){load.remove();add("assistant","エラー: "+e.message,"",true)}finally{$("send").disabled=false;$("message").focus()}
}
$("send").onclick=sendMessage;$("message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
migrateLegacyStorage();
loadServerStatus();
</script>
</body></html>
