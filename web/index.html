<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Navi Multi-AI Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; background:#0b0d10; color:#f4f7fb; }
    .wrap { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
    .card { background:#14181e; border:1px solid #2a313b; border-radius:16px; padding:16px; margin-bottom:14px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#aeb8c5; font-size:14px; }
    .status { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .pill { border:1px solid #384250; border-radius:999px; padding:5px 9px; font-size:12px; }
    label { display:block; margin:10px 0 6px; font-size:13px; color:#c7d0dc; }
    input,select,textarea,button { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #394453; background:#0f1318; color:#f4f7fb; padding:11px; font:inherit; }
    textarea { min-height:130px; resize:vertical; }
    button { margin-top:12px; cursor:pointer; background:#f4f7fb; color:#0b0d10; font-weight:700; }
    button:disabled { opacity:.45; cursor:wait; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .check { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:14px; }
    .check input { width:auto; }
    pre { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; line-height:1.65; }
    .small { color:#8f9aaa; font-size:12px; margin-top:7px; }
    .error { color:#ffb4b4; }
    @media (max-width:600px){ .row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>ナビィ — Multi-AI Chat v1</h1>
      <div class="sub">1つの窓口から、利用可能なAIへ振り分けます。</div>
      <div id="status" class="status"><span class="pill">状態確認中…</span></div>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <label for="provider">使うAI</label>
          <select id="provider">
            <option value="">自動で選ぶ</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="copilot">Copilot</option>
          </select>
        </div>
        <div>
          <label for="accessKey">接続キー</label>
          <input id="accessKey" type="password" autocomplete="off" placeholder="Railway側の GATEWAY_CHAT_KEY" />
          <div class="small">キーはこのタブの一時保存だけに保持します。</div>
        </div>
      </div>

      <label for="message">相談内容</label>
      <textarea id="message" placeholder="例：この仕様を調べて、実装案を作って"></textarea>

      <label class="check">
        <input id="verify" type="checkbox" />
        2つ目のAIでも確認する
      </label>

      <button id="send">ナビィに相談する</button>
    </section>

    <section class="card">
      <label>回答</label>
      <pre id="answer">まだ相談していません。</pre>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const send = document.getElementById("send");
    const answer = document.getElementById("answer");
    const keyInput = document.getElementById("accessKey");

    keyInput.value = sessionStorage.getItem("navi_access_key") || "";
    keyInput.addEventListener("input", () => {
      sessionStorage.setItem("navi_access_key", keyInput.value);
    });

    function pill(text) {
      const span = document.createElement("span");
      span.className = "pill";
      span.textContent = text;
      return span;
    }

    async function loadStatus() {
      try {
        const r = await fetch("/api/status");
        const data = await r.json();
        statusEl.textContent = "";
        for (const [name, ready] of Object.entries(data.providers || {})) {
          statusEl.appendChild(pill(name + ": " + (ready ? "接続済み" : "未設定")));
        }
        statusEl.appendChild(pill("メタルール: " + (data.meta_rules_status || "不明")));
      } catch {
        statusEl.textContent = "";
        statusEl.appendChild(pill("状態取得エラー"));
      }
    }

    send.addEventListener("click", async () => {
      const message = document.getElementById("message").value.trim();
      const preferred = document.getElementById("provider").value || null;
      const verify = document.getElementById("verify").checked;
      const key = keyInput.value.trim();

      if (!message) {
        answer.textContent = "相談内容を入力してください。";
        return;
      }
      if (!key) {
        answer.textContent = "接続キーを入力してください。";
        return;
      }

      send.disabled = true;
      answer.className = "";
      answer.textContent = "ナビィが処理中…";
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + key
          },
          body: JSON.stringify({
            message,
            preferred_provider: preferred,
            verify
          })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "HTTP " + r.status);

        const who = data?.navi?.selected_provider || "AI";
        const verifier = data?.navi?.verifier ? " / 検証: " + data.navi.verifier : "";
        answer.textContent = "担当: " + who + verifier + "\n\n" + (data.integrated_answer || data?.answer?.text || "");
      } catch (e) {
        answer.className = "error";
        answer.textContent = "エラー: " + e.message;
      } finally {
        send.disabled = false;
      }
    });

    loadStatus();
  </script>
</body>
</html>
