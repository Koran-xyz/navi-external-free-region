services:
  - type: web
    name: navi-external-free-region
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: GATEWAY_CHAT_KEY
        generateValue: true
      - key: GATEWAY_WRITE_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: COPILOT_BRIDGE_URL
        sync: false
      - key: COPILOT_BRIDGE_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATA_SOURCE_ID
        sync: false
      - key: NOTION_VERSION
        value: "2025-09-03"
      - key: ALLOWED_ORIGIN
        sync: false
