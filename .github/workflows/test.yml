name: test

on:
  pull_request:
  push:
    branches:
      - main
      - feature/multi-ai-chat-v1

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: node --check multi_ai_portal/worker/src/index.js
      - run: node --check multi_ai_portal/public/app.js
        env:
          PYTHONPATH: .:src
      - run: python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
      - run: docker build -t navi-external-free-region:test .
