name: test

on:
  pull_request:
  push:
    branches:
      - main
      - feature/multi-ai-chat-v1

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gcgw_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: gcgw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: .:src
          GCGW_TEST_POSTGRES_URL: postgresql://gcgw_test:local_ci_only@localhost:5432/gcgw_test
      - run: node --check multi_ai_portal/worker/src/index.js
      - run: node --check multi_ai_portal/public/app.js
      - run: python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
      - run: docker build -t navi-external-free-region:test .
